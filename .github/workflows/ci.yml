name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm build
      - run: pnpm contract:lint
      - run: pnpm test
      # e2e validates every response against contracts/openapi.yaml (see src/contract/contract.ts)
      - run: pnpm test:e2e

  contract:
    # Breaking changes to the contract fail the PR. Additive changes print a changelog.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialise the base contract
        run: git show "origin/${{ github.base_ref }}:contracts/openapi.yaml" > contracts/openapi.base.yaml
      - name: Changelog
        run: pnpm contract:diff | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Breaking changes
        run: pnpm contract:breaking
