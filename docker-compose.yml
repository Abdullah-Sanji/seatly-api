services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seatly
      POSTGRES_PASSWORD: seatly
      POSTGRES_DB: seatly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatly -d seatly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://seatly:seatly@postgres:5432/seatly
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      COOKIE_SECURE: "false"
      THROTTLE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["full"]
    build: ../seatly-web
    ports:
      - "8080:80"
    environment:
      API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  pgdata: {}
  redisdata: {}
